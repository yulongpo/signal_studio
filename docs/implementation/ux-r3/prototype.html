<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>UX-R3 交互合同预览</title><style>body{background:#141b26;color:#e7edf5;font:16px system-ui;margin:40px}button{background:#25354a;color:inherit;border:1px solid #486481;padding:12px;margin:5px;cursor:pointer}article{padding:24px;background:#1c2736;min-height:220px}small{color:#a9bdce}</style><h1>Signal Studio · UX-R3</h1><small>交互合同预览，非原生程序与算法证据</small><nav id="nav"></nav><article id="body"></article><script>const pages={'工程文件':'新建 name.ssproj → 添加信号 → 保存；打开、另存为与显式导入旧 v6。源文件缺失可重新定位，校验通过才恢复。','图谱布局':'<button onclick="this.parentNode.dataset.axis=this.textContent">A 单位置顶</button><button onclick="this.parentNode.dataset.axis=this.textContent">B 标题承载</button><button onclick="this.parentNode.dataset.axis=this.textContent">C 旋转标题</button><p>独立 tick/title 预算，辅助图与主图对齐，物理坐标和轴手势保留。</p>','标签发现':'data/name.data → label/name.txt → profile 校验 → 数量/来源反馈；未知 schema → 字段映射 → 预览 → 导入。取消无修改，无标签可手工绘制。','窄带页面':'<button onclick="document.getElementById(\'detail\').textContent=this.textContent+\'：消费共享分析状态\'">观察</button><button onclick="document.getElementById(\'detail\').textContent=this.textContent+\'：真实 IQ，共享同步\'">星座图</button><button onclick="document.getElementById(\'detail\').textContent=this.textContent+\'：独立视图，明确 Rs\'">眼图</button><button onclick="document.getElementById(\'detail\').textContent=\'调制识别：未部署模型时不可用\'">调制识别</button><button onclick="document.getElementById(\'detail\').textContent=\'解调：真实状态与示例分开\'">解调</button><p id="detail">通道与数据来源常驻；同步参数按需打开。</p>','检测联动':'统一配置 → 冻结任务/预检 → 阶段与已发布数 → 结果复核 → 标记编辑 → 窄带通道配置。单击选择，显式定位改变视区。'};for(const [name,content]of Object.entries(pages)){let b=document.createElement('button');b.textContent=name;b.onclick=()=>document.getElementById('body').innerHTML='<h2>'+name+'</h2>'+content;nav.appendChild(b)}nav.firstChild.click()</script></html>
